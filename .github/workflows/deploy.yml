name: Deploy to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to agentmart-exchange.netlify.app
        run: npx -y @netlify/mcp@latest --site-id b28ead9b-d94f-4f2f-baf5-846a1e762692 --proxy-path "$NETLIFY_DEPLOY_PROXY"
        env:
          NETLIFY_DEPLOY_PROXY: ${{ secrets.NETLIFY_DEPLOY_PROXY }}
